# Include inside http {} (e.g. /etc/nginx/sites-available/tv-filter, linked into sites-enabled/).
# The IoT devices' DNS points the hosts below at this box, so nginx picks these servers by SNI / Host alongside
# the other sites on 80/443. Neither is default_server: a name not listed here never reaches the app.
# Both hand requests to the koa app with the original Host, scheme and client IP; the app decides what to do.
# Keep server_name in step with the "host" patterns in rules.json, and make sure the cert covers each name.

upstream tv_filter {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen 80;
    http2 on;

    server_name
        .samsungads.com
        .adgrx.com
        samsungads.adsmeasurement.com
        osb-v2.samsungqbe.com
        lcprd1.samsungcloudsolution.net
        # rules that are disabled in rules.json; uncomment along with "enabled": true
        # .omtrdc.net
        # .conviva.com
        # .imrworldwide.com
        ;

    # one multi-SAN cert (leaf + eMudhra intermediate) covering every name above
    ssl_certificate     /etc/ssl/certs/tv-filter.crt;
    ssl_certificate_key /etc/ssl/private/tv-filter.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 443 is forwarded from the internet; only the LAN gets to use the app
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_http_version 1.1;
    # stream bodies both ways instead of spooling them to disk (video segments, uploads)
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://tv_filter;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-TLS-SNI $ssl_server_name;
    }
}
